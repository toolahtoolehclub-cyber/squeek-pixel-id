<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Squeekchain Pixel ID v6</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap');

    :root {
        --bg: #0a0514;
        --panel: #1a1130;
        --neon-g: #39ff14;
        --neon-b: #00ffff;
        --neon-r: #ff003c;
        --neon-y: #fcee0a;
        --text: #e0e0e0;
        --border: #4a2c82;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background-color: var(--bg);
        background-image: 
            radial-gradient(circle at 50% 0%, rgba(74, 44, 130, 0.4), transparent 50%),
            linear-gradient(rgba(57, 255, 20, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(57, 255, 20, 0.03) 1px, transparent 1px);
        background-size: 100% 100%, 20px 20px, 20px 20px;
        color: var(--text);
        font-family: 'Space Mono', monospace;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        overflow-x: hidden;
    }

    h1 {
        font-family: 'Press Start 2P', cursive;
        color: var(--neon-g);
        font-size: 20px;
        text-align: center;
        margin-bottom: 20px;
        text-shadow: 0 0 15px rgba(57,255,20,0.6);
        line-height: 1.4;
    }

    .container {
        width: 100%;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .panel {
        background: var(--panel);
        border: 2px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.8);
        position: relative;
    }

    .input-group { display: flex; flex-direction: column; gap: 10px; }
    label { font-size: 12px; color: var(--neon-b); font-weight: bold; letter-spacing: 1px;}
    
    input {
        background: #000;
        border: 2px solid var(--border);
        color: var(--neon-g);
        padding: 14px;
        border-radius: 8px;
        font-family: 'Space Mono', monospace;
        font-size: 14px;
        outline: none;
        width: 100%;
    }
    input:focus { border-color: var(--neon-g); box-shadow: 0 0 10px rgba(57,255,20,0.3); }

    button {
        background: var(--neon-b);
        color: #000;
        border: none;
        padding: 14px;
        border-radius: 8px;
        font-family: 'Space Mono', monospace;
        font-weight: bold;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s;
        text-transform: uppercase;
        width: 100%;
    }
    button:hover { opacity: 0.8; transform: translateY(-2px); }
    button:active { transform: translateY(0); }
    button.secondary { background: transparent; border: 2px solid var(--neon-b); color: var(--neon-b); }
    button.success { background: var(--neon-g); color: #000; }

    #msg { color: var(--neon-y); text-align: center; font-size: 12px; min-height: 20px; margin-top: 10px; }

    /* Card Area */
    #card-area { display: none; margin-top: 15px; text-align: center; }
    canvas#card-canvas { 
        background: #000; 
        border: 3px solid var(--neon-b); 
        border-radius: 12px; 
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        width: 100%; 
        max-width: 320px;
    }
    .card-actions { display: flex; gap: 10px; margin-top: 15px; }

    /* Game Area */
    #game-area { display: none; flex-direction: column; align-items: center; gap: 10px; margin-top: 15px;}
    canvas#game-canvas { 
        background: #000; 
        border: 3px solid var(--border); 
        border-radius: 12px; 
        width: 100%; 
        max-width: 350px;
        touch-action: none;
        box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    
    .game-controls { display: flex; gap: 10px; width: 100%; justify-content: center; }
    .hidden { display: none !important; }
</style>
</head>
<body>

    <h1>SQUEEKCHAIN<br>PIXEL ID v6</h1>

    <div class="container">
        <!-- PANEL INPUT & KARTU -->
        <div class="panel" id="main-panel">
            <div class="input-group">
                <label for="wallet-input">Wallet EVM (Sepolia)</label>
                <input type="text" id="wallet-input" placeholder="0x..." autocomplete="off" maxlength="42">
                <button onclick="generateCard()">Generate ID Card</button>
                <button onclick="connectWallet()" class="secondary">Hubungkan Wallet</button>
            </div>
            <p id="msg">Masukkan alamat wallet untuk memulai.</p>

            <!-- AREA KARTU -->
            <div id="card-area">
                <canvas id="card-canvas" width="320" height="460"></canvas>
                <div class="card-actions">
                    <button onclick="startGame('live')" class="success" id="btn-play-live">Main (Live)</button>
                    <button onclick="startGame('practice')" class="secondary">Latihan</button>
                </div>
            </div>
        </div>

        <!-- AREA GAME -->
        <div class="panel" id="game-area">
            <canvas id="game-canvas" width="320" height="480"></canvas>
            <div class="game-controls">
                <button onclick="endGame()" class="secondary">Berhenti Bermain</button>
            </div>
        </div>
    </div>

<script>
// ====== KONFIGURASI ======
const CFG = {
    API: 'https://api.squeekchain.com/v1/status',
    RPC: 'https://ethereum-sepolia-rpc.publicnode.com',
    SQK: '0x810239d271e80a86023f4f315943acbd65b59281',
};

const $ = id => document.getElementById(id);
const setMsg = (t, c = 'var(--neon-y)') => { $('msg').textContent = t; $('msg').style.color = c; };

let currentWallet = null;
let wheelData = { rpm: 0, dist: 0, status: 'OFFLINE' };

// ====== FETCH DATA API ======
async function fetchWheelData() {
    try {
        const res = await fetch(CFG.API);
        const data = await res.json();
        
        // Ekstrak data dari JSON asli Squeekchain
        const m = data.measurement;
        wheelData = {
            rpm: (m.rpmMilli || 0) / 1000,
            dist: m.distanceMm || 0,
            status: m.coreStatus || 'UNKNOWN'
        };
        return wheelData;
    } catch (e) {
        console.error("API Error:", e);
        wheelData = { rpm: 0, dist: 0, status: 'OFFLINE' };
        return wheelData;
    }
}

// ====== FETCH SALDO SQK ======
async function fetchSQK(wallet) {
    try {
        const data = '0x70a08231' + wallet.slice(2).toLowerCase().padStart(64, '0');
        const res = await fetch(CFG.RPC, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'eth_call', params: [{ to: CFG.SQK, data }, 'latest'] })
        });
        const json = await res.json();
        if (!json.result || json.result === '0x') return "0.00";
        const val = BigInt(json.result);
        const dec = 10n ** 18n;
        return (Number(val) / Number(dec)).toFixed(2);
    } catch (e) {
        return "ERROR";
    }
}

// ====== WALLET CONNECT ======
async function connectWallet() {
    if (typeof window.ethereum !== 'undefined') {
        try {
            setMsg('Meminta akses wallet...', 'var(--neon-b)');
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            $('wallet-input').value = accounts[0];
            setMsg('Wallet terhubung!', 'var(--neon-g)');
            generateCard();
        } catch (e) {
            setMsg('Koneksi ditolak.', 'var(--neon-r)');
        }
    } else {
        setMsg('Wallet tidak terdeteksi! Buka link ini di browser dompet (MetaMask/Trust).', 'var(--neon-r)');
    }
}

// ====== GENERATE KARTU ======
async function generateCard() {
    const wallet = $('wallet-input').value.trim();
    if (!/^0x[0-9a-fA-F]{40}$/.test(wallet)) {
        setMsg('Alamat wallet tidak valid!', 'var(--neon-r)');
        return;
    }

    currentWallet = wallet;
    setMsg('Mengambil data dari Squeekchain...', 'var(--neon-b)');
    
    // Ambil data secara paralel
    const [wData, sqkBal] = await Promise.all([fetchWheelData(), fetchSQK(wallet)]);

    // Render ke Canvas
    const c = $('card-canvas');
    const ctx = c.getContext('2d');
    
    // Background
    ctx.fillStyle = '#1a1130';
    ctx.fillRect(0, 0, c.width, c.height);
    
    // Border
    ctx.strokeStyle = '#00ffff';
    ctx.lineWidth = 4;
    ctx.strokeRect(2, 2, c.width - 4, c.height - 4);

    // Header
    ctx.fillStyle = '#00ffff';
    ctx.font = 'bold 18px "Space Mono"';
    ctx.textAlign = 'center';
    ctx.fillText('SQUEEK CITIZEN', c.width/2, 40);

    // Avatar Generator (Simple Hash)
    const hash = wallet.toLowerCase().split('').reduce((a, b) => { a = ((a << 5) - a) + b.charCodeAt(0); return a & a }, 0);
    const hue = Math.abs(hash) % 360;
    ctx.fillStyle = `hsl(${hue}, 80%, 60%)`;
    ctx.fillRect(110, 70, 100, 100);
    ctx.fillStyle = '#000';
    ctx.fillRect(130, 100, 15, 15); // Mata kiri
    ctx.fillRect(175, 100, 15, 15); // Mata kanan
    ctx.fillStyle = '#ff5c9a';
    ctx.fillRect(145, 130, 30, 10); // Hidung

    // Data Text
    ctx.textAlign = 'left';
    ctx.font = '12px "Space Mono"';
    
    const drawRow = (label, value, y, color = '#39ff14') => {
        ctx.fillStyle = '#888';
        ctx.fillText(label, 20, y);
        ctx.fillStyle = color;
        ctx.font = 'bold 14px "Space Mono"';
        ctx.fillText(value, 20, y + 16);
        ctx.font = '12px "Space Mono"';
    };

    drawRow('WALLET', wallet.slice(0, 6) + '...' + wallet.slice(-4), 210);
    drawRow('STATUS RODA', wData.status, 260, wData.status === 'ACTIVE' ? '#39ff14' : '#fcee0a');
    drawRow('KECEPATAN', wData.rpm.toFixed(1) + ' RPM', 310);
    drawRow('JARAK TEMPUH', (wData.dist / 1000).toFixed(2) + ' km', 360);
    drawRow('SALDO SQK', sqkBal + ' SQK', 410, '#00ffff');

    // Waktu
    ctx.fillStyle = '#555';
    ctx.font = '10px "Space Mono"';
    ctx.textAlign = 'center';
    ctx.fillText('SNAPSHOT ' + new Date().toISOString().slice(0, 16).replace('T', ' ') + ' UTC', c.width/2, 440);

    // Tampilkan
    $('card-area').style.display = 'block';
    setMsg('Kartu berhasil dibuat!', 'var(--neon-g)');

    // Cek apakah tombol Live Play bisa dipakai
    if (wData.status === 'ACTIVE' && wData.rpm > 1) {
        $('btn-play-live').disabled = false;
        $('btn-play-live').textContent = `Main (Live: ${wData.rpm.toFixed(1)} RPM)`;
    } else {
        $('btn-play-live').disabled = true;
        $('btn-play-live').textContent = 'Main (Hamster Tidur)';
    }
}

// ====== GAME LOGIC (PIANO TILES) ======
const gameCanvas = $('game-canvas');
const gCtx = gameCanvas.getContext('2d');
let game = { active: false, score: 0, combo: 0, notes: [], lastTime: 0, rpm: 0, spawnTimer: 0, targetY: 400 };

function startGame(mode) {
    $('main-panel').style.display = 'none';
    $('game-area').style.display = 'block';
    
    game.active = true;
    game.score = 0;
    game.combo = 0;
    game.notes = [];
    game.lastTime = performance.now();
    game.spawnTimer = 0;
    
    if (mode === 'live') {
        game.rpm = wheelData.rpm;
    } else {
        game.rpm = 60; // Mode latihan disimulasikan 60 RPM (1 putaran per detik)
    }

    setMsg('');
    requestAnimationFrame(gameLoop);
}

function spawnNote() {
    const lanes = [80, 160, 240];
    const x = lanes[Math.floor(Math.random() * lanes.length)];
    game.notes.push({ x, y: -20, hit: false, missed: false });
}

function gameLoop(now) {
    if (!game.active) return;
    const dt = (now - game.lastTime) / 1000;
    game.lastTime = now;

    // Konversi RPM ke BPM (Beats Per Minute)
    // 1 RPM = 1 putaran per menit. Kita anggap 1 putaran = 2 beat.
    let bpm = game.rpm * 2;
    if (bpm < 60) bpm = 60; // Minimal 60 BPM agar bisa dimainkan
    if (bpm > 200) bpm = 200; // Maksimal 200 BPM

    const interval = 60 / bpm;
    game.spawnTimer += dt;

    if (game.spawnTimer >= interval) {
        spawnNote();
        game.spawnTimer = 0;
    }

    // Update Notes
    for (let i = game.notes.length - 1; i >= 0; i--) {
        let n = game.notes[i];
        if (!n.hit && !n.missed) {
            n.y += 400 * dt; // Kecepatan jatuh balok
            if (n.y > game.targetY + 30) {
                n.missed = true;
                game.combo = 0;
            }
        }
        if (n.y > gameCanvas.height || n.hit) {
            game.notes.splice(i, 1);
        }
    }

    drawGame(bpm);
    requestAnimationFrame(gameLoop);
}

function drawGame(bpm) {
    gCtx.fillStyle = '#0a0514';
    gCtx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);

    // Lanes
    gCtx.strokeStyle = '#2a1a4a';
    gCtx.lineWidth = 2;
    [80, 160, 240].forEach(x => {
        gCtx.beginPath(); gCtx.moveTo(x, 0); gCtx.lineTo(x, gameCanvas.height); gCtx.stroke();
    });

    // Target Line
    gCtx.fillStyle = 'rgba(57, 255, 20, 0.2)';
    gCtx.fillRect(0, game.targetY, gameCanvas.width, 5);
    gCtx.fillStyle = '#39ff14';
    gCtx.fillRect(0, game.targetY + 5, gameCanvas.width, 2);

    // Notes
    game.notes.forEach(n => {
        if (n.hit) return;
        gCtx.fillStyle = n.missed ? '#ff003c' : '#00ffff';
        gCtx.shadowBlur = 10;
        gCtx.shadowColor = n.missed ? '#ff003c' : '#00ffff';
        gCtx.fillRect(n.x - 25, n.y, 50, 20);
        gCtx.shadowBlur = 0;
    });

    // Text
    gCtx.fillStyle = '#fff';
    gCtx.font = 'bold 24px "Space Mono"';
    gCtx.textAlign = 'center';
    gCtx.fillText(`SKOR: ${game.score}`, gameCanvas.width/2, 40);
    
    if (game.combo > 1) {
        gCtx.fillStyle = '#fcee0a';
        gCtx.font = 'bold 16px "Space Mono"';
        gCtx.fillText(`COMBO x${game.combo}`, gameCanvas.width/2, 70);
    }

    gCtx.fillStyle = '#888';
    gCtx.font = '12px "Space Mono"';
    gCtx.fillText(`BPM: ${Math.round(bpm)} (${game.rpm.toFixed(1)} RPM)`, gameCanvas.width/2, 460);
}

// Handle Tap
gameCanvas.addEventListener('pointerdown', (e) => {
    if (!game.active) return;
    const rect = gameCanvas.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;

    if (Math.abs(clickY - game.targetY) > 60) return;

    let hitNote = null;
    game.notes.forEach(n => {
        if (n.hit || n.missed) return;
        if (Math.abs(n.x - clickX) < 40 && Math.abs(n.y - game.targetY) < 50) {
            hitNote = n;
        }
    });

    if (hitNote) {
        hitNote.hit = true;
        game.score += 100;
        game.combo++;
    } else {
        game.combo = 0;
        game.score = Math.max(0, game.score - 10);
    }
});

function endGame() {
    game.active = false;
    $('game-area').style.display = 'none';
    $('main-panel').style.display = 'block';
    setMsg(`Game selesai! Skor: ${game.score}`, 'var(--neon-g)');
}
</script>
</body>
</html>
