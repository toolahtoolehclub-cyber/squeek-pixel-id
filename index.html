<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squeekchain Pixel ID</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <!-- Library yang sudah diperbaiki untuk Avatar -->
    <script src="https://cdn.jsdelivr.net/npm/ethereum-blockies-base64@1.0.2/dist/main.js"></script>
    <style>
        :root {
            --bg-color: #1a0b2e;
            --neon-green: #39ff14;
            --neon-blue: #00ffff;
            --neon-red: #ff003c;
            --neon-yellow: #fcee0a;
            --card-bg: #2d1b4e;
            --border-color: #5c3a8c;
        }
        body {
            background-color: var(--bg-color);
            background-image: linear-gradient(rgba(57, 255, 20, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(57, 255, 20, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            color: white;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        /* Efek Layar CRT (Scanlines) */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
        h1 { color: var(--neon-green); text-shadow: 2px 2px 0 #000; font-size: 16px; text-align: center; line-height: 1.5; margin-bottom: 20px; z-index: 3; }
        .input-group { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 350px; margin-bottom: 20px; z-index: 3; }
        input {
            padding: 12px; font-family: inherit; font-size: 10px; border: 2px solid var(--border-color);
            background: black; color: var(--neon-green); outline: none; border-radius: 4px;
        }
        input:focus { border-color: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); }
        button {
            padding: 12px; font-family: inherit; font-size: 10px; cursor: pointer;
            background: var(--neon-blue); color: black; border: 2px solid white;
            box-shadow: 4px 4px 0 black; transition: 0.1s; border-radius: 4px;
        }
        button:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0 black; }
        #download-btn { background: var(--neon-green); display: none; margin-top: 20px; z-index: 3; }
        
        /* Desain Kartu */
        .card-container { display: none; margin-top: 10px; z-index: 3; }
        #hamster-card {
            background: var(--card-bg); border: 4px solid var(--border-color);
            box-shadow: 8px 8px 0 rgba(0,0,0,0.6); padding: 20px; width: 300px;
            position: relative; text-align: center; border-radius: 8px;
        }
        .card-header { border-bottom: 2px dashed var(--border-color); padding-bottom: 15px; margin-bottom: 15px; }
        .card-header h2 { font-size: 14px; color: var(--neon-blue); margin: 0; text-shadow: 1px 1px 0 #000; }
        
        /* Avatar Image Styling */
        .avatar-container {
            width: 100px; height: 100px; background: #000; border: 3px solid var(--neon-blue);
            margin: 0 auto 15px auto; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; box-shadow: 0 0 15px var(--neon-blue); overflow: hidden;
        }
        .avatar-container img { width: 100%; height: 100%; image-rendering: pixelated; }
        
        .stats { text-align: left; font-size: 8px; line-height: 2; color: #ccc; }
        .stats span { color: var(--neon-green); float: right; font-size: 9px; }
        
        .live-badge { 
            position: absolute; top: -12px; right: -12px; background: var(--neon-red); color: white;
            font-size: 8px; padding: 6px; border: 2px solid white; animation: blink 1s infinite;
            border-radius: 4px; box-shadow: 0 0 10px var(--neon-red);
        }
        @keyframes blink { 50% { opacity: 0; } }
        .status-active { color: var(--neon-green) !important; text-shadow: 0 0 5px var(--neon-green); }
        .status-idle { color: var(--neon-yellow) !important; text-shadow: 0 0 5px var(--neon-yellow); }
    </style>
</head>
<body>

    <h1>SQUEEKCHAIN<br>PIXEL ID v2.0</h1>

    <div class="input-group">
        <input type="text" id="wallet-input" placeholder="Enter Sepolia Wallet (0x...)">
        <button onclick="generateCard()">GENERATE IDENTITY</button>
    </div>

    <div class="card-container" id="card-container">
        <div id="hamster-card">
            <div class="live-badge" id="api-badge">LIVE API</div>
            <div class="card-header">
                <h2>SQUEEK CITIZEN</h2>
            </div>
            
            <div class="avatar-container">
                <img id="c-avatar" src="" alt="avatar">
            </div>
            
            <div class="stats">
                WALLET:<br>
                <span id="c-wallet" style="font-size: 7px; word-break: break-all; float:none; display:block; margin-top:5px; margin-bottom:10px;">0x...</span>
                
                WHEEL RPM:<br>
                <span id="c-rpm">Fetching...</span><br>
                
                DISTANCE (MM):<br>
                <span id="c-dist">Fetching...</span><br>
                
                WHEEL STATUS:<br>
                <span id="c-status">Fetching...</span><br>
                
                TOTAL SQK:<br>
                <span id="c-sqk">0.00 SQK</span>
            </div>
            
            <div style="margin-top: 20px; font-size: 8px; color: var(--neon-blue); text-shadow: 1px 1px 0 #000;">
                VERIFIED ON SQUEekCHAIN
            </div>
        </div>
    </div>

    <button id="download-btn" onclick="downloadCard()">DOWNLOAD IMAGE</button>

    <script>
        async function generateCard() {
            const wallet = document.getElementById('wallet-input').value.trim();
            if(!wallet || !wallet.startsWith('0x') || wallet.length < 42) {
                alert("Please enter a valid EVM wallet address (starting with 0x)!"); return;
            }

            // Tampilkan UI
            document.getElementById('card-container').style.display = 'block';
            document.getElementById('download-btn').style.display = 'inline-block';
            document.getElementById('c-wallet').innerText = wallet;

            // 1. GENERATE AVATAR (Menggunakan fungsi dari library yang baru)
            try {
                const avatarDataUrl = ethereumBlockies(wallet);
                document.getElementById('c-avatar').src = avatarDataUrl;
            } catch (e) {
                // Jika gagal generate avatar, pakai gambar default
                document.getElementById('c-avatar').src = "https://api.dicebear.com/7.x/pixel-art/svg?seed=" + wallet;
            }

            // 2. FETCH DATA API (Dipisah agar tetap jalan meski avatar error)
            document.getElementById('c-rpm').innerText = "Syncing...";
            document.getElementById('c-dist').innerText = "Syncing...";
            document.getElementById('c-status').innerText = "Syncing...";

            try {
                const response = await fetch('https://api.squeekchain.com/v1/status');
                const data = await response.json();

                const rpm = parseInt(data.wheel?.rpm || data.rpm || 0);
                const distance = data.wheel?.totalDistanceMm || data.distance || "0";
                
                document.getElementById('c-rpm').innerText = rpm + " RPM";
                document.getElementById('c-dist').innerText = distance;

                const statusEl = document.getElementById('c-status');
                if (rpm > 0) {
                    statusEl.innerText = "ACTIVE 🏃‍♂️";
                    statusEl.className = "status-active";
                } else {
                    statusEl.innerText = "IDLE 💤";
                    statusEl.className = "status-idle";
                }

            } catch (error) {
                console.error("API Error:", error);
                document.getElementById('c-rpm').innerText = "OFFLINE";
                document.getElementById('c-dist').innerText = "OFFLINE";
                document.getElementById('c-status').innerText = "OFFLINE";
                document.getElementById('api-badge').style.backgroundColor = "gray";
            }
        }

        function downloadCard() {
            const card = document.getElementById('hamster-card');
            html2canvas(card, { backgroundColor: null, scale: 2, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Squeekchain_Pixel_ID_v2.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }
    </script>
</body>
</html>
