<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Squeekchain Pixel ID v11</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap');

:root {
    --bg-dark: #05020a;
    --panel-glass: rgba(26, 17, 48, 0.75);
    --green: #39ff14; 
    --blue: #00ffff; 
    --red: #ff365f; 
    --yellow: #fcee0a; 
    --text: #f0f0f0; 
    --border: rgba(74, 44, 130, 0.8);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

body {
    margin: 0; min-height: 100vh; padding: 20px;
    background: radial-gradient(circle at 50% 0%, #150a2b 0%, var(--bg-dark) 70%);
    background-attachment: fixed;
    color: var(--text); font-family: 'Space Mono', monospace;
    display: flex; align-items: center; flex-direction: column;
}

@keyframes neonPulse {
    0%, 100% { text-shadow: 0 0 10px rgba(57,255,20,0.5); }
    50% { text-shadow: 0 0 20px rgba(57,255,20,0.8), 0 0 30px rgba(57,255,20,0.4); }
}

h1 {
    font: 16px/1.6 'Press Start 2P', cursive; 
    color: var(--green); text-align: center; 
    margin: 10px 0 20px; animation: neonPulse 2s infinite ease-in-out;
}

.container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }

.panel {
    background: var(--panel-glass);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border); border-radius: 16px; padding: 20px; 
    box-shadow: 0 10px 40px rgba(0,0,0,0.7);
}

.stack { display: flex; flex-direction: column; gap: 10px; }

button {
    width: 100%; border: none; border-radius: 10px; padding: 14px; 
    background: var(--blue); color: #000; font: 700 12px 'Space Mono', monospace; 
    text-transform: uppercase; cursor: pointer; transition: all 0.2s;
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
}
button:active { transform: translateY(2px); }
button.secondary { background: rgba(0,255,255,0.1); border: 1px solid var(--blue); color: var(--blue); }
button.success { background: var(--green); box-shadow: 0 0 10px rgba(57, 255, 20, 0.3); }
button.danger { background: rgba(255,54,95,0.1); border: 1px solid var(--red); color: var(--red); }

input {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); 
    background: rgba(0,0,0,0.5); color: var(--green); font: 12px 'Space Mono', monospace;
}

#message { text-align: center; color: var(--yellow); font-size: 11px; margin: 10px 0; min-height: 15px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
.stat { padding: 10px; background: rgba(0,0,0,0.5); border: 1px solid var(--border); border-radius: 10px; text-align: center; }
.stat b { display: block; color: var(--green); font-size: 16px; margin-bottom: 2px; }
.stat span { font-size: 9px; color: #a090b0; }

canvas { display: block; border-radius: 10px; margin: 0 auto; }
#gameCanvas { border: 2px solid var(--border); touch-action: none; background: #000; }
#cardCanvas { border: 2px solid var(--blue); background: #000; display: none; }
#gamePanel { display: none; }
</style>
</head>
<body>

<h1>SQUEEKCHAIN<br>PIXEL ID v11</h1>

<div class="container">
  <section class="panel" id="mainPanel">
    <div class="stack">
      <button class="success" onclick="startGame()">Mulai Main Game</button>
    </div>
    <div style="border-top: 1px solid var(--border); margin: 15px 0;"></div>
    <div class="stack">
      <label style="font-size: 11px; color: var(--blue);">Wallet address (opsional)</label>
      <input id="walletInput" type="text" autocomplete="off" placeholder="0x...">
      <button class="secondary" id="generateBtn" onclick="generateCard()">Generate ID Card</button>
    </div>
    <p id="message">Pilih mode permainan atau masukkan wallet.</p>
    <div id="cardArea" style="text-align: center;">
      <canvas id="cardCanvas" width="320" height="460"></canvas>
      <button class="success" onclick="downloadCard()" style="margin-top: 15px;">Unduh PNG</button>
    </div>
  </section>

  <section class="panel" id="gamePanel">
    <div class="stats">
      <div class="stat"><b id="scoreVal">0</b><span>SKOR</span></div>
      <div class="stat"><b id="comboVal">0</b><span>COMBO</span></div>
      <div class="stat"><b id="bpmVal">120</b><span>BPM</span></div>
    </div>
    <!-- Canvas Ukuran Standar, Tanpa DPR Scaling -->
    <canvas id="gameCanvas" width="320" height="400"></canvas>
    <p style="text-align:center; font-size:10px; color:#a090b0; margin: 10px 0;">Ketuk lane saat balok mendekati garis hijau.</p>
    <button class="danger" onclick="stopGame()">Berhenti Bermain</button>
  </section>
</div>

<script>
// ====== STATE ======
let isPlaying = false;
let score = 0, combo = 0, bpm = 120;
let notes = [];
let lastTime = 0;
let rafId = null;
let audioCtx = null;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const targetY = 320; // Garis target di bawah
const noteSpeed = 300;
const hitWindow = 40;

// ====== AUDIO ======
function initAudio() {
    if (!audioCtx) {
        const AudioConstructor = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioConstructor();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playBeep(freq, dur, vol) {
    if (!audioCtx || audioCtx.state !== 'running') return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square'; // Suara lebih tajam agar jelas
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
}

// ====== GAME ENGINE ======
function startGame() {
    initAudio();
    document.getElementById('mainPanel').style.display = 'none';
    document.getElementById('gamePanel').style.display = 'block';
    
    isPlaying = true;
    score = 0; combo = 0; notes = [];
    updateUI();
    
    lastTime = performance.now();
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(gameLoop);
    
    // Spawn note menggunakan interval waktu (bukan timer game loop)
    if (window.spawnInterval) clearInterval(window.spawnInterval);
    window.spawnInterval = setInterval(() => {
        if (!isPlaying) return;
        const lanes = [53, 160, 267];
        notes.push({ x: lanes[Math.floor(Math.random() * 3)], y: -20, hit: false, missed: false });
        playBeep(600, 0.03, 0.02); // Tick metronom
    }, 60000 / bpm / 2); // BPM dipercepat 2x agar seru
}

function stopGame() {
    isPlaying = false;
    if (rafId) cancelAnimationFrame(rafId);
    if (window.spawnInterval) clearInterval(window.spawnInterval);
    
    document.getElementById('gamePanel').style.display = 'none';
    document.getElementById('mainPanel').style.display = 'block';
    document.getElementById('message').innerText = `Selesai! Skor Akhir: ${score}`;
    document.getElementById('message').style.color = 'var(--green)';
}

function gameLoop(now) {
    if (!isPlaying) return;
    
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.1) dt = 0.1; // Cap dt

    // Bersihkan Canvas
    ctx.fillStyle = '#0a0514'; ctx.fillRect(0, 0, 320, 400);
    
    // Garis Lanes
    ctx.strokeStyle = '#30204d'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(106, 0); ctx.lineTo(106, 400); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(213, 0); ctx.lineTo(213, 400); ctx.stroke();

    // Garis Target
    ctx.fillStyle = 'rgba(57,255,20,0.2)'; ctx.fillRect(0, targetY, 320, 20);
    ctx.fillStyle = '#39ff14'; ctx.fillRect(0, targetY, 320, 3);

    // Update & Draw Notes
    for (let i = notes.length - 1; i >= 0; i--) {
        let n = notes[i];
        
        // LOGIKA PENGHAPUSAN (Agar merah tidak menetap)
        if (n.hit || n.y > 400) {
            notes.splice(i, 1);
            continue;
        }

        n.y += noteSpeed * dt;
        
        // Cek Miss
        if (!n.missed && n.y > targetY + hitWindow) {
            n.missed = true;
            combo = 0;
            playBeep(200, 0.1, 0.05); // Suara Miss
            updateUI();
        }

        // Gambar Note
        ctx.fillStyle = n.missed ? '#ff365f' : '#00ffff';
        ctx.fillRect(n.x - 24, Math.round(n.y), 48, 20);
    }

    rafId = requestAnimationFrame(gameLoop);
}

// ====== INPUT ======
canvas.addEventListener('pointerdown', (e) => {
    if (!isPlaying) return;
    e.preventDefault();
    
    // Konversi koordinat klik dengan tepat
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top) * (canvas.height / rect.height);
    
    // Abaikan jika klik jauh dari garis target
    if (Math.abs(y - targetY) > 60) return;

    let hitSomething = false;
    for (let i = 0; i < notes.length; i++) {
        let n = notes[i];
        if (n.hit || n.missed) continue;
        
        // Deteksi tabrakan (Bounding Box)
        if (Math.abs(n.x - x) < 40 && Math.abs((n.y + 10) - targetY) < hitWindow) {
            n.hit = true;
            hitSomething = true;
            
            // Hitung skor
            if (Math.abs((n.y + 10) - targetY) < 15) {
                score += 300;
                playBeep(800, 0.05, 0.08); // Perfect
            } else {
                score += 100;
                playBeep(500, 0.05, 0.05); // Good
            }
            combo++;
            break;
        }
    }
    
    if (!hitSomething) {
        combo = 0;
    }
    updateUI();
});

function updateUI() {
    document.getElementById('scoreVal').innerText = score;
    document.getElementById('comboVal').innerText = combo;
    document.getElementById('bpmVal').innerText = bpm;
}

// ====== CARD GENERATOR (PIXEL ART) ======
function generateCard() {
    const wallet = document.getElementById('walletInput').value.trim();
    if (!/^0x[a-fA-F0-9]{40}$/.test(wallet)) {
        document.getElementById('message').innerText = 'Alamat wallet tidak valid.';
        document.getElementById('message').style.color = 'var(--red)';
        return;
    }

    const c = document.getElementById('cardCanvas');
    const ctx = c.getContext('2d');
    
    ctx.fillStyle = '#1a1130'; ctx.fillRect(0, 0, 320, 460);
    ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 4; ctx.strokeRect(2, 2, 316, 456);

    ctx.textAlign = 'center'; ctx.fillStyle = '#00ffff'; ctx.font = 'bold 16px "Space Mono"';
    ctx.fillText('SQUEEK CITIZEN', 160, 35);

    // --- Gambar Avatar Pixel ---
    // Buat hash sederhana dari wallet
    let hash = 0;
    for (let i = 0; i < wallet.length; i++) hash += wallet.charCodeAt(i);
    
    ctx.fillStyle = '#000'; ctx.fillRect(110, 60, 100, 100);
    
    const hue = hash % 360;
    const furColor = `hsl(${hue}, 80%, 60%)`;
    const darkColor = `hsl(${hue}, 80%, 30%)`;
    
    // Gambar grid 16x16 sederhana
    for(let y=0; y<16; y++) {
        for(let x=0; x<8; x++) {
            // Logika bentuk hamster bulat
            let dx = (x - 7.5) / 7;
            let dy = (y - 9) / 6;
            if (dx*dx + dy*dy > 1) continue;
            
            ctx.fillStyle = furColor;
            // Random spots gelap
            if ((hash >> ((x+y)%10)) & 1) ctx.fillStyle = darkColor;
            
            // Telinga
            if (y < 3 && (x === 1 || x === 2 || x === 5 || x === 6)) ctx.fillStyle = darkColor;
            // Mata
            if (y === 8 && (x === 4 || x === 5)) ctx.fillStyle = '#000';
            // Hidung
            if (y === 10 && x === 3) ctx.fillStyle = '#ff5c9a';
            
            // Gambar pixel 6x6 di kiri dan kanan (simetris)
            ctx.fillRect(112 + x*6, 62 + y*6, 6, 6);
            ctx.fillRect(112 + (15-x)*6, 62 + y*6, 6, 6);
        }
    }
    // --- Selesai Avatar ---

    const drawRow = (label, val, y, color) => {
        ctx.textAlign = 'left'; ctx.fillStyle = '#a090b0'; ctx.font = '11px "Space Mono"';
        ctx.fillText(label, 25, y);
        ctx.fillStyle = color; ctx.font = 'bold 14px "Space Mono"';
        ctx.fillText(val, 25, y+16);
    };

    drawRow('WALLET', wallet.slice(0,8)+'...'+wallet.slice(-6), 190, '#39ff14');
    drawRow('STATUS RODA', 'IDLE (OFFLINE)', 240, '#fcee0a');
    drawRow('DISTANCE', '6.349 km', 290, '#39ff14');
    drawRow('SQK BALANCE', 'NOT VERIFIED', 340, '#ff365f');

    ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = '9px "Space Mono"';
    ctx.fillText('UNOFFICIAL SNAPSHOT', 160, 430);

    document.getElementById('cardCanvas').style.display = 'block';
    document.getElementById('message').innerText = 'Kartu berhasil dibuat!';
    document.getElementById('message').style.color = 'var(--green)';
}

function downloadCard() {
    const link = document.createElement('a');
    link.download = 'squeekchain-card.png';
    link.href = document.getElementById('cardCanvas').toDataURL('image/png');
    link.click();
}
</script>
</body>
</html>
