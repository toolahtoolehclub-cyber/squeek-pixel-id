<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squeekchain Pixel ID</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #1a0b2e;
            --neon-green: #39ff14;
            --neon-blue: #00ffff;
            --card-bg: #2d1b4e;
            --border-color: #5c3a8c;
        }
        body {
            background-color: var(--bg-color);
            background-image: linear-gradient(rgba(57, 255, 20, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(57, 255, 20, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            color: white;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        h1 { color: var(--neon-green); text-shadow: 2px 2px 0 #000; font-size: 16px; text-align: center; line-height: 1.5; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 350px; margin-bottom: 20px; }
        input {
            padding: 10px; font-family: inherit; font-size: 10px; border: 2px solid var(--border-color);
            background: black; color: var(--neon-green); outline: none;
        }
        input:focus { border-color: var(--neon-green); }
        button {
            padding: 10px; font-family: inherit; font-size: 10px; cursor: pointer;
            background: var(--neon-blue); color: black; border: 2px solid white;
            box-shadow: 4px 4px 0 black; transition: 0.1s;
        }
        button:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0 black; }
        #download-btn { background: var(--neon-green); display: none; margin-top: 20px; }
        .card-container { display: none; margin-top: 10px; }
        #hamster-card {
            background: var(--card-bg); border: 4px solid var(--border-color);
            box-shadow: 8px 8px 0 rgba(0,0,0,0.5); padding: 15px; width: 300px;
            position: relative; text-align: center;
        }
        .card-header { border-bottom: 2px dashed var(--border-color); padding-bottom: 10px; margin-bottom: 15px; }
        .card-header h2 { font-size: 12px; color: var(--neon-blue); margin: 0; }
        .avatar {
            width: 100px; height: 100px; background: #000; border: 2px solid var(--neon-green);
            margin: 0 auto 15px auto; display: flex; align-items: center; justify-content: center;
            font-size: 40px;
        }
        .stats { text-align: left; font-size: 8px; line-height: 1.8; color: #ccc; }
        .stats span { color: var(--neon-green); float: right; }
        .live-badge { 
            position: absolute; top: -10px; right: -10px; background: red; color: white;
            font-size: 8px; padding: 5px; border: 2px solid white; animation: blink 1s infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <h1>SQUEEKCHAIN<br>PIXEL ID GENERATOR</h1>
    <div class="input-group">
        <input type="text" id="wallet-input" placeholder="Enter Wallet Address (0x...)">
        <button onclick="generateCard()">GENERATE MY ID</button>
    </div>
    <div class="card-container" id="card-container">
        <div id="hamster-card">
            <div class="live-badge">LIVE API</div>
            <div class="card-header">
                <h2>SQUEEK CITIZEN</h2>
            </div>
            <div class="avatar">🐹</div>
            <div class="stats">
                WALLET:<br>
                <span id="c-wallet" style="font-size: 6px; word-break: break-all; float:none; display:block; margin-top:5px;">0x...</span><br>
                WHEEL RPM:<br><span id="c-rpm">Fetching...</span><br>
                DISTANCE (MM):<br><span id="c-dist">Fetching...</span><br>
                TOTAL SQK:<br><span id="c-sqk">Fetching...</span>
            </div>
            <div style="margin-top: 15px; font-size: 8px; color: var(--neon-green);">
                VERIFIED ON SQUEekCHAIN
            </div>
        </div>
    </div>
    <button id="download-btn" onclick="downloadCard()">DOWNLOAD IMAGE</button>
    <script>
        async function generateCard() {
            const wallet = document.getElementById('wallet-input').value;
            if(!wallet || !wallet.startsWith('0x')) {
                alert("Please enter a valid wallet address (starting with 0x)!"); return;
            }
            document.getElementById('card-container').style.display = 'block';
            document.getElementById('download-btn').style.display = 'inline-block';
            document.getElementById('c-wallet').innerText = wallet;
            try {
                const response = await fetch('https://api.squeekchain.com/v1/status');
                const data = await response.json();
                const rpm = data.wheel?.rpm || data.rpm || "0";
                const distance = data.wheel?.totalDistanceMm || data.distance || "0";
                document.getElementById('c-rpm').innerText = rpm + " RPM";
                document.getElementById('c-dist').innerText = distance;
                document.getElementById('c-sqk').innerText = "0.00 SQK";
            } catch (error) {
                document.getElementById('c-rpm').innerText = "API OFFLINE";
                document.getElementById('c-dist').innerText = "-";
            }
        }
        function downloadCard() {
            const card = document.getElementById('hamster-card');
            html2canvas(card, { backgroundColor: null, scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Squeekchain_Pixel_ID.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }
    </script>
</body>
  </html>
