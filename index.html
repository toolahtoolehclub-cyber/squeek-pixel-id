<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>SQUEEKCHAIN // ULTIMATE v19</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Background WebGL (Organism) -->
<canvas id="bg-gl"></canvas>

<div id="ui-layer">
    <header>
        <h1>SQUEEKCHAIN</h1>
        <h2>PIXEL ID // v19 ULTIMATE</h2>
    </header>

    <main class="container">
        <!-- PANEL UTAMA (MENU) -->
        <section class="panel" id="mainPanel">
            <div class="stack">
                <label>WALLET ADDRESS (SEED)</label>
                <input id="walletInput" type="text" autocomplete="off" placeholder="0x...">
                <p class="anthem" id="anthemInfo">AWAITING INPUT...</p>
                
                <label>// GENRE</label>
                <div class="diff-row" id="genreRow">
                    <button class="btn-diff active" data-genre="cyber">CYBER</button>
                    <button class="btn-diff" data-genre="synth">SYNTH</button>
                    <button class="btn-diff" data-genre="chip">CHIP</button>
                </div>

                <label>// DIFFICULTY</label>
                <div class="diff-row" id="diffRow">
                    <button class="btn-diff active" data-diff="easy">EASY</button>
                    <button class="btn-diff" data-diff="normal">NORMAL</button>
                    <button class="btn-diff" data-diff="hard">HARD</button>
                </div>

                <button class="btn-primary" id="playBtn">INITIALIZE RHYTHM</button>
                <button class="btn-secondary" id="genBtn">GENERATE ID CARD</button>
            </div>
            <p class="msg" id="message">SYSTEM READY.</p>
            
            <!-- AREA KARTU -->
            <div id="cardArea" class="hidden stack">
                <canvas id="card-canvas"></canvas>
                <div class="row">
                    <button class="btn-primary" id="dlBtn">[ DOWNLOAD ]</button>
                    <button class="btn-secondary" id="shareBtn">[ SHARE ]</button>
                </div>
            </div>
        </section>

        <!-- PANEL GAME -->
        <section class="panel hidden" id="gamePanel">
            <div class="stats">
                <div class="stat"><b id="scoreVal">0</b><span>SCORE</span></div>
                <div class="stat"><b id="comboVal">0</b><span>COMBO</span></div>
                <div class="stat"><b id="accVal">100%</b><span>ACC</span></div>
                <div class="stat"><b id="bpmVal">120</b><span>BPM</span></div>
            </div>
            <canvas id="game-canvas"></canvas>
            <p class="hint">TAP LANE WHEN BLOCK HITS THE LINE.</p>
            <button class="btn-danger" id="stopBtn">[ TERMINATE ]</button>
        </section>

        <!-- PANEL HASIL -->
        <section class="panel hidden" id="resultPanel">
            <div class="grade" id="gradeVal">S</div>
            <div class="kv" id="resultKv"></div>
            <p class="msg" id="bestMsg"></p>
            <div class="stack">
                <button class="btn-primary" id="againBtn">RETRY</button>
                <button class="btn-secondary" id="toCardBtn">GENERATE CARD</button>
                <button class="btn-danger" id="homeBtn">EXIT TO MENU</button>
            </div>
        </section>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
