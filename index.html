<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05020a">
<title>Squeekchain Pixel ID v16</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>SQUEEKCHAIN<br>PIXEL ID v16</h1>
<p class="sub">WALLET ANTHEM · PRO EDITION</p>
<div class="container">
 <section class="panel" id="mainPanel">
  <div class="stack">
   <label for="walletInput">Wallet address (opsional)</label>
   <input id="walletInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="0x...">
   <button class="secondary" id="connectBtn">Ambil dari Wallet</button>
   <p class="anthem" id="anthemInfo"></p>
   
   <label>Pilih Genre Musik</label>
   <div class="diff-row" id="genreRow">
     <button class="diff-btn active" data-genre="cyber">CYBER</button>
     <button class="diff-btn" data-genre="synth">SYNTH</button>
     <button class="diff-btn" data-genre="chip">CHIP</button>
   </div>

   <label>Pilih Kesulitan</label>
   <div class="diff-row" id="diffRow">
     <button class="diff-btn active" data-diff="easy">EASY</button>
     <button class="diff-btn" data-diff="normal">NORMAL</button>
     <button class="diff-btn" data-diff="hard">HARD</button>
   </div>

   <button class="success" id="playBtn">Mainkan Anthem</button>
   <button class="secondary" id="genBtn">Generate ID Card</button>
  </div>
  <p class="msg" id="message">Masukkan wallet, atau main sebagai GUEST.</p>
  <div id="cardArea" class="hidden stack">
   <canvas id="card"></canvas>
   <div class="row"><button class="success" id="dlBtn">Unduh PNG</button><button class="secondary" id="shareBtn">Bagikan</button></div>
  </div>
 </section>

 <section class="panel hidden" id="gamePanel">
  <div class="stats">
   <div class="stat"><b id="scoreVal">0</b><span>SKOR</span></div>
   <div class="stat"><b id="comboVal">0</b><span>COMBO</span></div>
   <div class="stat"><b id="accVal">100%</b><span>AKURASI</span></div>
   <div class="stat"><b id="bpmVal">120</b><span>BPM</span></div>
  </div>
  <canvas id="game"></canvas>
  <p class="hint">Ketuk lane saat balok menyentuh garis hijau.</p>
  <button class="danger" id="stopBtn">Berhenti</button>
 </section>

 <section class="panel hidden result" id="resultPanel">
  <div class="grade" id="gradeVal">S</div>
  <div class="kv" id="resultKv"></div>
  <p class="msg" id="bestMsg"></p>
  <div class="stack"><button class="success" id="againBtn">Main Lagi</button><button class="secondary" id="toCardBtn">Cetak ke ID Card</button><button class="danger" id="homeBtn">Kembali</button></div>
 </section>
</div>
<script src="script.js"></script>
</body>
</html>
