<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="Squeekchain Pixel ID">
<title>Squeekchain Pixel ID v3</title>
<style>
:root{--bg:#1a0b2e;--g:#39ff14;--b:#00ffff;--y:#fcee0a;--line:#5c3a8c}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg);color:#fff;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px 16px}
h1{color:var(--g);font-size:20px;letter-spacing:2px;text-align:center;margin:0;text-shadow:2px 2px 0 #000}
form{display:flex;flex-direction:column;gap:8px;width:100%;max-width:360px}
label{color:var(--b)}
input,button{font:inherit;padding:12px;border-radius:4px;border:2px solid var(--line)}
input{background:#000;color:var(--g)}
button{background:var(--b);color:#000;cursor:pointer;font-weight:700;box-shadow:3px 3px 0 #000}
button:active{transform:translate(3px,3px);box-shadow:none}
button.alt{background:transparent;color:var(--b)}
input:focus-visible,button:focus-visible{outline:2px solid var(--g);outline-offset:2px}
#msg{min-height:1.6em;margin:0;color:var(--y);text-align:center}
canvas{display:none;width:min(100%,320px);border-radius:8px;box-shadow:8px 8px 0 rgba(0,0,0,.6)}
#actions{display:none;gap:8px}
</style>
</head>
<body>
<h1>SQUEEKCHAIN<br>PIXEL ID v3</h1>

<form id="f">
  <label for="w">Wallet EVM (Sepolia)</label>
  <input id="w" autocomplete="off" spellcheck="false" maxlength="42" placeholder="0x…">
  <button type="submit">Buat kartu</button>
  <button type="button" class="alt" id="conn">Hubungkan wallet</button>
</form>
<p id="msg" role="status" aria-live="polite"></p>

<canvas id="card" aria-label="Kartu Squeek Citizen"></canvas>
<div id="actions">
  <button type="button" id="dl">Unduh PNG</button>
  <button type="button" class="alt" id="sh">Bagikan</button>
</div>

<script>
// ====== KONFIGURASI ======
const CFG = {
  API: 'https://api.squeekchain.com/v1/status',
  RPC: 'https://ethereum-sepolia-rpc.publicnode.com',
  SQK: '0x810239d271e80a86023f4f315943acbd65b59281', // Kontrak Token SQK Sepolia
  DEC: 18
};

const $ = id => document.getElementById(id);
const ADDR = /^0x[0-9a-fA-F]{40}$/;
let current = null, ctrl = null, fromWallet = false;
const setMsg = t => { $('msg').textContent = t; };

// ====== IDENTITAS DETERMINISTIK ======
async function hashBytes(s) {
  return new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)));
}
function traits(h) {
  const roll = h[1] / 255;
  const rarity = roll > .97 ? ['LEGENDARY', '#fcee0a']
               : roll > .85 ? ['EPIC', '#c77dff']
               : roll > .55 ? ['RARE', '#00ffff'] : ['COMMON', '#9aa5b1'];
  return { hue: Math.round(h[0] / 255 * 360), rarity, acc: ['NONE', 'CROWN', 'SHADES', 'HEADBAND'][h[2] % 4] };
}
function drawAvatar(g, h, t, x0, y0, s) {
  const fur = `hsl(${t.hue} 70% 55%)`, dark = `hsl(${t.hue} 70% 33%)`, belly = `hsl(${t.hue} 55% 88%)`;
  const px = (x, y, c) => { g.fillStyle = c; g.fillRect(x0 + x * s, y0 + y * s, s, s); };
  const both = (x, y, c) => { px(x, y, c); px(15 - x, y, c); };
  for (let y = 0; y < 16; y++) for (let x = 0; x < 8; x++) {
    const dx = (x - 7.5) / 7, dy = (y - 9) / 6.2;
    if (dx * dx + dy * dy > 1) continue;
    let c = fur;
    if (y > 11 && x > 2) c = belly;
    else if (y < 10 && x < 6 && ((h[4 + x] >> (y % 8)) & 1)) c = dark;
    both(x, y, c);
  }
  [[2, 2], [3, 2], [2, 3], [3, 3]].forEach(([x, y]) => both(x, y, dark));
  both(5, 8, '#000'); both(7, 10, '#ff5c9a');
  if (t.acc === 'CROWN') [[5, 1], [7, 1], [6, 2], [7, 2], [8, 2], [9, 1], [10, 1], [8, 1]].forEach(([x, y]) => px(x, y, '#fcee0a'));
  if (t.acc === 'SHADES') for (let x = 3; x <= 12; x++) px(x, 8, '#000');
  if (t.acc === 'HEADBAND') for (let x = 3; x <= 12; x++) px(x, 5, '#ff003c');
}

// ====== DATA ======
function timeout(ms, parent) {
  const c = new AbortController(), id = setTimeout(() => c.abort(), ms);
  parent.addEventListener('abort', () => c.abort());
  return { signal: c.signal, done: () => clearTimeout(id) };
}
async function getWheel(parent) {
  const T = timeout(6000, parent);
  try {
    const r = await fetch(CFG.API, { signal: T.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    
    // Skema API Squeekchain yang benar
    const rpmMilli = Number(d?.measurement?.rpmMilli);
    const distMm = Number(d?.measurement?.distanceMm);
    const coreStatus = d?.measurement?.coreStatus;

    if (!Number.isFinite(rpmMilli)) throw new Error('skema tak dikenal');
    
    const rpm = rpmMilli / 1000;
    return { 
      rpm: rpm.toFixed(1), 
      dist: Number.isFinite(distMm) ? distMm.toLocaleString('id-ID') : 'N/A', 
      status: coreStatus || (rpm > 0 ? 'ACTIVE' : 'IDLE') 
    };
  } catch (e) {
    if (parent.aborted) throw e;
    return { rpm: 'OFFLINE', dist: 'OFFLINE', status: 'OFFLINE' };
  } finally { T.done(); }
}
async function getSQK(w, parent) {
  const T = timeout(6000, parent);
  try {
    const data = '0x70a08231' + w.slice(2).toLowerCase().padStart(64, '0');
    const r = await fetch(CFG.RPC, {
      method: 'POST', headers: { 'content-type': 'application/json' }, signal: T.signal,
      body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'eth_call', params: [{ to: CFG.SQK, data }, 'latest'] })
    });
    const j = await r.json();
    if (!j.result || j.result === '0x') throw new Error('kosong');
    const u = 10n ** BigInt(CFG.DEC), v = BigInt(j.result);
    return (v / u).toString() + '.' + ((v % u) * 100n / u).toString().padStart(2, '0') + ' SQK';
  } catch (e) {
    if (parent.aborted) throw e;
    return 'ERROR';
  } finally { T.done(); }
}

// ====== KARTU ======
function render(w, t, h, s) {
  const c = $('card'), S = 2, W = 320, H = 460;
  c.width = W * S; c.height = H * S;
  const g = c.getContext('2d');
  g.scale(S, S); g.imageSmoothingEnabled = false;
  g.fillStyle = '#2d1b4e'; g.fillRect(0, 0, W, H);
  g.strokeStyle = t.rarity[1]; g.lineWidth = 4; g.strokeRect(2, 2, W - 4, H - 4);
  g.textAlign = 'center';
  g.fillStyle = '#00ffff'; g.font = 'bold 18px ui-monospace,Menlo,monospace'; g.fillText('SQUEEK CITIZEN', W / 2, 36);
  g.fillStyle = t.rarity[1]; g.font = 'bold 12px ui-monospace,Menlo,monospace'; g.fillText(t.rarity[0] + ' / ' + t.acc, W / 2, 56);
  g.fillStyle = '#000'; g.fillRect(96, 72, 128, 128);
  drawAvatar(g, h, t, 96, 72, 8);
  g.strokeStyle = '#00ffff'; g.lineWidth = 3; g.strokeRect(96, 72, 128, 128);
  g.textAlign = 'left';
  [['WALLET', w.slice(0, 8) + '…' + w.slice(-6)], ['COMMUNITY WHEEL RPM', s.rpm], ['WHEEL DISTANCE (MM)', s.dist],
   ['WHEEL STATUS', s.status], ['YOUR SQK', s.sqk]].forEach(([k, v], i) => {
    const y = 232 + i * 38;
    g.fillStyle = '#aab'; g.font = '11px ui-monospace,Menlo,monospace'; g.fillText(k, 24, y);
    g.fillStyle = '#39ff14'; g.font = 'bold 14px ui-monospace,Menlo,monospace'; g.fillText(v, 24, y + 17);
  });
  g.textAlign = 'center'; g.font = 'bold 11px ui-monospace,Menlo,monospace';
  g.fillStyle = fromWallet ? '#39ff14' : '#fcee0a';
  g.fillText(fromWallet ? 'DARI WALLET TERHUBUNG' : 'INPUT MANUAL - BELUM TERVERIFIKASI', W / 2, H - 18);
  c.style.display = 'block'; $('actions').style.display = 'flex';
}

// ====== ALUR ======
async function generate(addr) {
  const w = addr.trim();
  if (!ADDR.test(w)) { setMsg('Alamat tidak valid: harus 0x diikuti 40 karakter hex.'); return; }
  ctrl?.abort(); ctrl = new AbortController();
  const sig = ctrl.signal;
  setMsg('Menyinkronkan…');
  const h = await hashBytes(w.toLowerCase()), t = traits(h);
  try {
    const [wheel, sqk] = await Promise.all([getWheel(sig), getSQK(w, sig)]);
    render(w, t, h, { ...wheel, sqk });
    current = w;
    try { history.replaceState(null, '', '?w=' + w); } catch {}
    setMsg(wheel.status === 'OFFLINE' ? 'API wheel offline. Kartu tetap dibuat.' : '');
  } catch (e) {
    if (e.name !== 'AbortError') setMsg('Gagal membuat kartu. Coba lagi.');
  }
}
async function connect() {
  if (!window.ethereum) { setMsg('Wallet browser tidak terdeteksi.'); return; }
  try {
    const [a] = await ethereum.request({ method: 'eth_requestAccounts' });
    fromWallet = true; $('w').value = a; generate(a);
  } catch { setMsg('Koneksi wallet dibatalkan.'); }
}
const toBlob = () => new Promise(r => $('card').toBlob(r, 'image/png'));
async function download() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(await toBlob());
  a.download = 'squeek-id-' + current.slice(2, 8) + '.png';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function share() {
  const f = new File([await toBlob()], 'squeek-id.png', { type: 'image/png' });
  if (navigator.canShare?.({ files: [f] })) {
    try { await navigator.share({ files: [f], title: 'Squeekchain Pixel ID' }); } catch {}
  } else { download(); }
}

$('f').addEventListener('submit', e => { e.preventDefault(); generate($('w').value); });
$('w').addEventListener('input', () => { fromWallet = false; });
$('conn').addEventListener('click', connect);
$('dl').addEventListener('click', download);
$('sh').addEventListener('click', share);
const q = new URLSearchParams(location.search).get('w');
if (q) { $('w').value = q; generate(q); }
</script>
</body>
</html>
